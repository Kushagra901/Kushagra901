<svg viewBox="0 0 480 195" width="480" height="195" xmlns="http://www.w3.org/2000/svg">
<defs>
  <clipPath id="statsRound"><rect width="480" height="195" rx="14"/></clipPath>
  <linearGradient id="statsBg" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#0d1117"/><stop offset="100%" stop-color="#0a0f16"/>
  </linearGradient>
</defs>
<g clip-path="url(#statsRound)">
  <rect width="480" height="195" fill="url(#statsBg)" stroke="#1e2d3a"/>
  <text x="20" y="30" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700"
        fill="#e6edf3">Kushagra's GitHub Stats</text>
  <circle cx="20" cy="45" r="3" fill="#3ddc97">
    <animate attributeName="opacity" values="1;0.35;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="30" y="49" font-family="JetBrains Mono, Consolas, monospace" font-size="10.5" fill="#3ddc97">Open to opportunities</text>

  <circle cx="95" cy="120" r="52" fill="none" stroke="#1b2733" stroke-width="9"/>
  <circle cx="95" cy="120" r="52" fill="none" stroke="#00d9ff" stroke-width="9"
          stroke-linecap="round" stroke-dasharray="326.7" stroke-dashoffset="326.7"
          transform="rotate(-90 95 120)">
    <animate attributeName="stroke-dashoffset" from="326.7" to="71.9"
              begin="0.3s" dur="1.4s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
  </circle>
  <text x="95" y="117" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20"
        font-weight="800" fill="#00d9ff">A+</text>
  <text x="95" y="134" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="9"
        fill="#7d8fa0">ACTIVITY</text>

  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="1.00s" dur="0.5s" fill="freeze"/>
    <circle cx="200" cy="64" r="3" fill="#00d9ff"/>
    <text x="212" y="69" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#7d8fa0">Public Repos</text>
    <text x="465" y="69" text-anchor="end" font-family="JetBrains Mono, Consolas, monospace" font-size="13"
          font-weight="700" fill="#e6edf3">13</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="1.14s" dur="0.5s" fill="freeze"/>
    <circle cx="200" cy="93" r="3" fill="#00d9ff"/>
    <text x="212" y="98" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#7d8fa0">Followers</text>
    <text x="465" y="98" text-anchor="end" font-family="JetBrains Mono, Consolas, monospace" font-size="13"
          font-weight="700" fill="#e6edf3">0</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="1.28s" dur="0.5s" fill="freeze"/>
    <circle cx="200" cy="122" r="3" fill="#00d9ff"/>
    <text x="212" y="127" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#7d8fa0">Primary Stack</text>
    <text x="465" y="127" text-anchor="end" font-family="JetBrains Mono, Consolas, monospace" font-size="13"
          font-weight="700" fill="#e6edf3">JS · CSS · TS · Python</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="1.42s" dur="0.5s" fill="freeze"/>
    <circle cx="200" cy="151" r="3" fill="#00d9ff"/>
    <text x="212" y="156" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#7d8fa0">Focus</text>
    <text x="465" y="156" text-anchor="end" font-family="JetBrains Mono, Consolas, monospace" font-size="13"
          font-weight="700" fill="#e6edf3">Backend · Agentic AI</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="1.56s" dur="0.5s" fill="freeze"/>
    <circle cx="200" cy="180" r="3" fill="#00d9ff"/>
    <text x="212" y="185" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#7d8fa0">Joined GitHub</text>
    <text x="465" y="185" text-anchor="end" font-family="JetBrains Mono, Consolas, monospace" font-size="13"
          font-weight="700" fill="#e6edf3">Feb 2025</text>
  </g>
</g>
</svg>
