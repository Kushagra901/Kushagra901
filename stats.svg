<svg viewBox="0 0 480 195" width="480" height="195" xmlns="http://www.w3.org/2000/svg">
<defs>
  <clipPath id="statsRound"><rect width="480" height="195" rx="14"/></clipPath>
  <linearGradient id="statsBg" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#0d1117"/><stop offset="100%" stop-color="#0a0f16"/>
  </linearGradient>
</defs>
<g clip-path="url(#statsRound)">
  <rect width="480" height="195" fill="url(#statsBg)" stroke="#1e2d3a"/>
  <text x="20" y="30" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700"
        fill="#e6edf3">Kushagra's GitHub Stats</text>

  <circle cx="95" cy="97" r="58" fill="none" stroke="#1b2733" stroke-width="10"/>
  <circle cx="95" cy="97" r="58" fill="none" stroke="#00d9ff" stroke-width="10"
          stroke-linecap="round" stroke-dasharray="364.4" stroke-dashoffset="364.4"
          transform="rotate(-90 95 97)">
    <animate attributeName="stroke-dashoffset" from="364.4" to="80.2"
              begin="0.3s" dur="1.4s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
  </circle>
  <text x="95" y="95" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22"
        font-weight="800" fill="#00d9ff">A+</text>
  <text x="95" y="113" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="9.5"
        fill="#7d8fa0">ACTIVITY</text>

  
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="1.00s" dur="0.5s" fill="freeze"/>
      <circle cx="200" cy="41" r="3" fill="#00d9ff"/>
      <text x="212" y="46" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#7d8fa0">Public Repos</text>
      <text x="465" y="46" text-anchor="end" font-family="JetBrains Mono, Consolas, monospace" font-size="13"
            font-weight="700" fill="#e6edf3">10</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="1.18s" dur="0.5s" fill="freeze"/>
      <circle cx="200" cy="75" r="3" fill="#00d9ff"/>
      <text x="212" y="80" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#7d8fa0">Followers</text>
      <text x="465" y="80" text-anchor="end" font-family="JetBrains Mono, Consolas, monospace" font-size="13"
            font-weight="700" fill="#e6edf3">0</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="1.36s" dur="0.5s" fill="freeze"/>
      <circle cx="200" cy="109" r="3" fill="#00d9ff"/>
      <text x="212" y="114" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#7d8fa0">Following</text>
      <text x="465" y="114" text-anchor="end" font-family="JetBrains Mono, Consolas, monospace" font-size="13"
            font-weight="700" fill="#e6edf3">0</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="1.54s" dur="0.5s" fill="freeze"/>
      <circle cx="200" cy="143" r="3" fill="#00d9ff"/>
      <text x="212" y="148" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#7d8fa0">Joined GitHub</text>
      <text x="465" y="148" text-anchor="end" font-family="JetBrains Mono, Consolas, monospace" font-size="13"
            font-weight="700" fill="#e6edf3">Feb 2025</text>
    </g>
</g>
</svg>