name: generate animated snake

"on":
  schedule:
    - cron: "0 0 * * *"   # runs once a day at midnight UTC
  workflow_dispatch:        # allows manual runs from the Actions tab
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: generate snake svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Kushagra901
          outputs: |
            dist/github-snake.svg?color_snake=%2338bdf8&color_dots=%230d1117,%23163b4d,%231b6a8a,%231fa8c9,%2300d9ff
            dist/github-snake-dark.svg?color_snake=%2338bdf8&color_dots=%230d1117,%23163b4d,%231b6a8a,%231fa8c9,%2300d9ff
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: push snake svg to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
