name: generate contribution snake

on:
  schedule:
    - cron: "0 */6 * * *"   # refresh every 6 hours
  workflow_dispatch:         # lets you trigger it manually from the Actions tab
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: Kushagra901
          outputs: |
            dist/github-snake.svg?color_snake=%230284c7&color_dots=%23ebedf0,%23a5f3fc,%2338bdf8,%230284c7,%230369a1
            dist/github-snake-dark.svg?color_snake=%2300d9ff&color_dots=%2321262d,%230c4a6e,%230891b2,%2338bdf8,%2300d9ff

      - name: push snake to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
