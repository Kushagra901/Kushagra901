name: GitHub Metrics

on:
  schedule:
    - cron: "0 0 * * *" # Runs daily at midnight UTC
  workflow_dispatch: # Also allows manual trigger

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # ----------------------------
      # 1. SKILL RADAR CHART
      # ----------------------------
      - name: Generate Skill Radar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Kushagra901
          template: classic
          base: ""
          plugins_errors_fatal: no
          filename: assets/radar-dark.svg
          config_display: large
          config_animations: yes
          plugin_habits: yes
          plugin_habits_charts: yes
          plugin_habits_charts_type: radar
          plugin_habits_days: 14
          plugin_habits_facts: no
          config_theme: dark

      # ----------------------------
      # 2. 3D ISOMETRIC CALENDAR
      # ----------------------------
      - name: Generate 3D Isometric Calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Kushagra901
          template: classic
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugins_errors_fatal: no
          filename: assets/metrics.isocalendar.svg
          config_theme: dark
          config_animations: yes

      # ----------------------------
      # 3. STATS + LANGUAGES CARD
      # ----------------------------
      - name: Generate Stats + Languages Card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Kushagra901
          template: classic
          base: activity, community, repositories, metadata
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_recent_categories: markup, programming
          plugin_languages_recent_days: 14
          plugin_languages_recent_load: 300
          plugin_languages_sections: most-used
          plugin_languages_threshold: 0%
          plugins_errors_fatal: no
          filename: assets/card-stats-dark.svg
          config_theme: dark
          config_animations: yes
