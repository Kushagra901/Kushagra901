<svg viewBox="0 0 1200 560" width="1200" height="560" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
<defs>
  <clipPath id="panelRound"><rect width="1200" height="560" rx="16"/></clipPath>
  <linearGradient id="pBg" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#0d1117"/><stop offset="100%" stop-color="#0a0f16"/>
  </linearGradient>
  <linearGradient id="pIri" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#22d3ee"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#22d3ee"/>
    <animate attributeName="x1" values="-20%;120%;-20%" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="80%;220%;80%" dur="7s" repeatCount="indefinite"/>
  </linearGradient>
  <pattern id="pDots" width="26" height="26" patternUnits="userSpaceOnUse">
    <circle cx="1.1" cy="1.1" r="1.1" fill="#22d3ee" opacity="0.05"/>
  </pattern>
</defs>

<g clip-path="url(#panelRound)">
  <rect width="1200" height="560" fill="url(#pBg)" stroke="#1e2d3a"/>
  <rect width="1200" height="560" fill="url(#pDots)"/>

  <text x="40" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#e6edf3">Featured Projects</text>
  <text x="40" y="76" font-family="JetBrains Mono, Consolas, monospace" font-size="12.5" fill="#7d8fa0">Selected work — backend systems &amp; applied AI</text>

  <text x="40" y="122" font-family="JetBrains Mono, Consolas, monospace" font-size="11" letter-spacing="1.5" fill="#5c7080">PROJECT</text>
  <text x="660" y="122" font-family="JetBrains Mono, Consolas, monospace" font-size="11" letter-spacing="1.5" fill="#5c7080">STACK</text>
  <text x="1000" y="122" font-family="JetBrains Mono, Consolas, monospace" font-size="11" letter-spacing="1.5" fill="#5c7080">TYPE</text>
  <line x1="40" y1="136" x2="1160" y2="136" stroke="#1e2d3a" stroke-width="1"/>

  <!-- Row 1: medical-portal -->
  <g>
    <circle cx="44" cy="170" r="3" fill="url(#pIri)"/>
    <a xlink:href="https://github.com/Kushagra901/medical-portal" target="_blank">
      <text x="56" y="176" font-family="Segoe UI, Arial, sans-serif" font-size="16.5" font-weight="700" fill="#e6edf3">medical-portal</text>
    </a>
    <text x="56" y="198" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#7d8fa0">Full medical portal — auth, patient/doctor dashboards, prescriptions, lab reports, AI chatbot.</text>

    <rect x="660" y="158" width="70" height="26" rx="13" fill="#0d1117" stroke="#1e2d3a"/>
    <text x="695" y="175" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="11" fill="#c9d6e0">Node.js</text>
    <rect x="738" y="158" width="82" height="26" rx="13" fill="#0d1117" stroke="#1e2d3a"/>
    <text x="779" y="175" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="11" fill="#c9d6e0">MongoDB</text>
    <rect x="828" y="158" width="94" height="26" rx="13" fill="#0d1117" stroke="#1e2d3a"/>
    <text x="875" y="175" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="11" fill="#c9d6e0">AI Chatbot</text>

    <rect x="1000" y="158" width="88" height="26" rx="13" fill="none" stroke="#34d399"/>
    <text x="1044" y="175" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="11" fill="#34d399">Platform</text>
  </g>
  <line x1="40" y1="212" x2="1160" y2="212" stroke="#1e2d3a" stroke-width="1" stroke-dasharray="2 4" opacity="0.7"/>

  <!-- Row 2: neocheck -->
  <g>
    <circle cx="44" cy="246" r="3" fill="url(#pIri)"/>
    <a xlink:href="https://github.com/Kushagra901/neocheck" target="_blank">
      <text x="56" y="252" font-family="Segoe UI, Arial, sans-serif" font-size="16.5" font-weight="700" fill="#e6edf3">neocheck</text>
    </a>
    <text x="56" y="274" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#7d8fa0">Personal life-management system — task, habit &amp; activity tracking in one place.</text>

    <rect x="660" y="234" width="60" height="26" rx="13" fill="#0d1117" stroke="#1e2d3a"/>
    <text x="690" y="251" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="11" fill="#c9d6e0">React</text>
    <rect x="728" y="234" width="70" height="26" rx="13" fill="#0d1117" stroke="#1e2d3a"/>
    <text x="763" y="251" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="11" fill="#c9d6e0">Node.js</text>
    <rect x="806" y="234" width="82" height="26" rx="13" fill="#0d1117" stroke="#1e2d3a"/>
    <text x="847" y="251" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="11" fill="#c9d6e0">MongoDB</text>

    <rect x="1000" y="234" width="66" height="26" rx="13" fill="none" stroke="#fbbf24"/>
    <text x="1033" y="251" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="11" fill="#fbbf24">Tool</text>
  </g>
  <line x1="40" y1="288" x2="1160" y2="288" stroke="#1e2d3a" stroke-width="1" stroke-dasharray="2 4" opacity="0.7"/>

  <!-- Row 3: report-ai -->
  <g>
    <circle cx="44" cy="322" r="3" fill="url(#pIri)"/>
    <a xlink:href="https://github.com/Kushagra901/report-ai" target="_blank">
      <text x="56" y="328" font-family="Segoe UI, Arial, sans-serif" font-size="16.5" font-weight="700" fill="#e6edf3">report-ai</text>
    </a>
    <text x="56" y="350" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#7d8fa0">AI-assisted report generation tool built with TypeScript.</text>

    <rect x="660" y="310" width="100" height="26" rx="13" fill="#0d1117" stroke="#1e2d3a"/>
    <text x="710" y="327" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="11" fill="#c9d6e0">TypeScript</text>
    <rect x="768" y="310" width="70" height="26" rx="13" fill="#0d1117" stroke="#1e2d3a"/>
    <text x="803" y="327" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="11" fill="#c9d6e0">OpenAI</text>

    <rect x="1000" y="310" width="88" height="26" rx="13" fill="none" stroke="#818cf8"/>
    <text x="1044" y="327" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="11" fill="#818cf8">AI Tool</text>
  </g>
  <line x1="40" y1="364" x2="1160" y2="364" stroke="#1e2d3a" stroke-width="1" stroke-dasharray="2 4" opacity="0.7"/>

  <!-- Row 4: Civic-Pulse -->
  <g>
    <circle cx="44" cy="398" r="3" fill="url(#pIri)"/>
    <a xlink:href="https://github.com/Kushagra901/Civic-Pulse" target="_blank">
      <text x="56" y="404" font-family="Segoe UI, Arial, sans-serif" font-size="16.5" font-weight="700" fill="#e6edf3">Civic-Pulse</text>
    </a>
    <text x="56" y="426" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#7d8fa0">Civic issue reporting platform for local communities.</text>

    <rect x="660" y="386" width="90" height="26" rx="13" fill="#0d1117" stroke="#1e2d3a"/>
    <text x="705" y="403" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="11" fill="#c9d6e0">JavaScript</text>
    <rect x="758" y="386" width="66" height="26" rx="13" fill="#0d1117" stroke="#1e2d3a"/>
    <text x="791" y="403" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="11" fill="#c9d6e0">React</text>

    <rect x="1000" y="386" width="88" height="26" rx="13" fill="none" stroke="#34d399"/>
    <text x="1044" y="403" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="11" fill="#34d399">Platform</text>
  </g>

  <line x1="40" y1="440" x2="1160" y2="440" stroke="#1e2d3a" stroke-width="1"/>
  <text x="40" y="468" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-style="italic" fill="#7d8fa0">"The best backend is the one that scales silently and fails gracefully."</text>
  <text x="1160" y="468" text-anchor="end" font-family="JetBrains Mono, Consolas, monospace" font-size="11" fill="#5c7080">github.com/Kushagra901 →</text>
</g>
</svg>
